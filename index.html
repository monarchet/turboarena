<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Arena — Solo Car Soccer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div class="score left"><span id="blueScore">0</span></div>
    <div class="timer" id="timer">2:00</div>
    <div class="score right"><span id="orangeScore">0</span></div>
    <div id="boostWrap"><div id="boostBar"></div><span>BOOST</span></div>
    <div id="ballCam">BALL CAM <b>OFF</b></div>
    <div id="message"></div>
  </div>
  <div id="menu">
    <div class="brand">TURBO <span>ARENA</span></div>
    <div class="sub">SOLO CAR SOCCER</div>
    <button id="playBtn">JUGAR 1v1</button>
    <button id="freeBtn">FREE PLAY</button>
    <div class="controls">
      <b>CONTROLES</b>
      <span>W/S acelerar · A/D girar</span>
      <span>Click izq. boost · Click der. salto</span>
      <span>Shift powerslide · Q/E air-roll en el aire · Space ball cam</span>
      <span>R reinicia balón · Esc pausa</span>
    </div>
    <div class="note">Motor WebGL independiente · pensado para GitHub Pages</div>
  </div>
  <div id="pause" class="overlay hidden"><h2>PAUSA</h2><p>ESC para continuar</p></div>
</div>
<script src="game.js"></script>
</body>
</html>
